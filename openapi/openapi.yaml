openapi: 3.1.0
info:
  title: Wing Pal Location
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /v1/presences/{presenceId}/location:
    put:
      tags:
      - location-controller
      operationId: updateLocation
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FixResponse"
      security:
      - presenceToken: []
  /v1/presences/{presenceId}/discovery-projections:
    put:
      tags:
      - location-controller
      summary: Replace all discovery projections; only mutual geography and hard-filter
        PASS produce offers
      operationId: replaceDiscoveryProjections
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryProjectionsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedResponse"
      security:
      - presenceToken: []
  /v1/presences:
    post:
      tags:
      - location-controller
      summary: Create an anonymous presence; raw token returned once
      operationId: createPresence
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PresenceResponse"
  /v1/presences/{presenceId}/offers/{offerHandle}/encounter:
    post:
      tags:
      - encounter-controller
      operationId: claimEncounterFromOffer
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offerHandle
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Existing result returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterResponse"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterResponse"
      security:
      - presenceToken: []
        nodeSignature: []
        nodeSignatureInput: []
  /v1/presences/{presenceId}/offers/{offerHandle}/decline:
    post:
      tags:
      - location-controller
      operationId: declineLocationOffer
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offerHandle
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedResponse"
      security:
      - presenceToken: []
  /v1/presences/{presenceId}/offers/{offerHandle}/accept:
    post:
      tags:
      - location-controller
      operationId: acceptLocationOffer
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offerHandle
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedResponse"
      security:
      - presenceToken: []
  /v1/nodes:
    post:
      tags:
      - node-controller
      summary: Register an Ed25519 node after private-key proof
      description: "Sign these US-ASCII bytes with Ed25519, including the final newline:\
        \ `KAVOZI-NODE-REGISTRATION-V1\\nchallenge-id:<lowercase UUID>\\nchallenge:<unpadded\
        \ Base64url challenge>\\npublic-key-fingerprint:<sha256:unpadded Base64url\
        \ SHA-256 of canonical SPKI>\\naudience:kavozi-api\\n`. The challenge is single-use.\
        \ The public key is immutable; losing its private key requires a new identity\
        \ in v1. Registration does not authorize a Presence."
      operationId: registerNode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
        required: true
      responses:
        "201":
          description: Node registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "400":
          description: Invalid registration proof or challenge
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Public key already registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request too large
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/node-registration-challenges:
    post:
      tags:
      - node-controller
      summary: Issue a single-use Ed25519 registration challenge
      description: Submit an unpadded Base64url canonical DER Ed25519 SubjectPublicKeyInfo.
        The returned random challenge is bound to SHA-256 of the canonical SPKI and
        expires after the configured lifetime (120 seconds by default). Registration
        does not create or authorize a Presence.
      operationId: issueNodeRegistrationChallenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
        required: true
      responses:
        "201":
          description: Challenge issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          description: Invalid key
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request too large
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/encounters/{encounterId}/participants:
    post:
      tags:
      - encounter-controller
      operationId: joinEncounter
      parameters:
      - name: encounterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Content-Digest
        in: header
        description: "SHA-256 digest of the exact request body, covered by the node\
          \ signature"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinEncounterRequest"
        required: true
      responses:
        "200":
          description: Existing result returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterResponse"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterResponse"
      security:
      - nodeSignature: []
        nodeSignatureInput: []
  /v1/encounters/{encounterId}/messages:
    post:
      tags:
      - encounter-controller
      operationId: sendEncounterMessage
      parameters:
      - name: encounterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Content-Digest
        in: header
        description: "SHA-256 digest of the exact request body, covered by the node\
          \ signature"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEncounterMessageRequest"
        required: true
      responses:
        "200":
          description: Existing result returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEvent"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEvent"
      security:
      - nodeSignature: []
        nodeSignatureInput: []
  /v1/encounters/{encounterId}/invitations:
    post:
      tags:
      - encounter-controller
      operationId: createEncounterInvitation
      parameters:
      - name: encounterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Content-Digest
        in: header
        description: "SHA-256 digest of the exact request body, covered by the node\
          \ signature"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEncounterInvitationRequest"
        required: true
      responses:
        "200":
          description: Existing result returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterInvitationResponse"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncounterInvitationResponse"
      security:
      - nodeSignature: []
        nodeSignatureInput: []
  /v1/presences/{presenceId}/inbox:
    get:
      tags:
      - location-controller
      operationId: getPresenceInbox
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InboxResponse"
      security:
      - presenceToken: []
  /v1/location/administrative-areas:
    get:
      tags:
      - location-controller
      operationId: searchAdministrativeAreas
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - CITY
          - DISTRICT
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdministrativeAreaResponse"
  /v1/intent-templates:
    get:
      tags:
      - intent-template-controller
      summary: List enabled intent templates
      operationId: listIntentTemplates
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntentTemplateSummary"
  /v1/intent-templates/{key}:
    get:
      tags:
      - intent-template-controller
      summary: Get an enabled intent template
      operationId: getIntentTemplate
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Unknown or disabled template
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Template definition
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateResponse"
  /v1/encounters:
    get:
      tags:
      - encounter-controller
      operationId: listNodeEncounters
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - WAITING_FOR_MEMBERS
          - OPEN
          - CLOSED
          - EXPIRED
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EncounterListResponse"
      security:
      - nodeSignature: []
        nodeSignatureInput: []
  /v1/encounters/{encounterId}:
    get:
      tags:
      - encounter-controller
      operationId: getEncounter
      parameters:
      - name: encounterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EncounterResponse"
      security:
      - nodeSignature: []
        nodeSignatureInput: []
  /v1/encounters/{encounterId}/events:
    get:
      tags:
      - encounter-controller
      operationId: getEncounterEvents
      parameters:
      - name: encounterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: afterSequence
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EncounterEventPage"
      security:
      - nodeSignature: []
        nodeSignatureInput: []
  /.well-known/kavozi-location:
    get:
      tags:
      - location-controller
      operationId: getLocationMetadata
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataResponse"
  /.well-known/kavozi-encounter:
    get:
      tags:
      - encounter-controller
      summary: Discover messenger limits and the node-signature profile
      operationId: getEncounterMetadata
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EncounterMetadataResponse"
  /v1/presences/{presenceId}:
    delete:
      tags:
      - location-controller
      operationId: deletePresence
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      security:
      - presenceToken: []
  /v1/encounters/{encounterId}/participants/me:
    delete:
      tags:
      - encounter-controller
      operationId: leaveEncounter
      parameters:
      - name: encounterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      security:
      - nodeSignature: []
        nodeSignatureInput: []
  /v1/encounters/{encounterId}/invitations/{invitationId}:
    delete:
      tags:
      - encounter-controller
      operationId: revokeEncounterInvitation
      parameters:
      - name: encounterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      security:
      - nodeSignature: []
        nodeSignatureInput: []
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    FixRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        accuracyMeters:
          type: number
          format: double
          minimum: 0
        observedAt:
          type: string
          format: date-time
        sequence:
          type: integer
          format: int64
          minimum: 0
      required:
      - accuracyMeters
      - latitude
      - longitude
      - observedAt
      - sequence
    FixResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACCEPTED
        sequence:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time
    BooleanValue:
      type: object
      additionalProperties: false
      properties:
        value:
          type: boolean
        type:
          type: string
          enum:
          - BOOLEAN
      required:
      - type
      - value
    CodeValue:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
        type:
          type: string
          enum:
          - CODE
      required:
      - type
      - value
    DiscoveryProjectionRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        geography:
          $ref: "#/components/schemas/GeographyRequest"
        claims:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DiscoveryValue"
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/HardRequirementRequest"
      required:
      - geography
      - id
    DiscoveryProjectionsRequest:
      type: object
      additionalProperties: false
      properties:
        projections:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryProjectionRequest"
      required:
      - projections
    DiscoveryValue:
      discriminator:
        propertyName: type
        mapping:
          BOOLEAN: "#/components/schemas/BooleanValue"
          NUMBER: "#/components/schemas/NumberValue"
          CODE: "#/components/schemas/CodeValue"
          TEXT: "#/components/schemas/TextValue"
          SET: "#/components/schemas/SetValue"
          RANGE: "#/components/schemas/RangeValue"
      oneOf:
      - $ref: "#/components/schemas/BooleanValue"
      - $ref: "#/components/schemas/NumberValue"
      - $ref: "#/components/schemas/CodeValue"
      - $ref: "#/components/schemas/TextValue"
      - $ref: "#/components/schemas/SetValue"
      - $ref: "#/components/schemas/RangeValue"
    GeographyRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - RADIUS
          - ADMINISTRATIVE_AREA
        radiusMeters:
          type: number
          format: double
        administrativeAreaId:
          type: string
          format: uuid
      required:
      - type
    HardRequirementRequest:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        operator:
          type: string
          enum:
          - EQ
          - NEQ
          - GT
          - GTE
          - LT
          - LTE
          - IN
          - NOT_IN
          - INTERSECTS
          - CONTAINS_ALL
          - RANGE_INTERSECTS
        value:
          $ref: "#/components/schemas/DiscoveryValue"
      required:
      - field
      - operator
      - value
    NumberValue:
      type: object
      additionalProperties: false
      properties:
        value:
          type: number
        type:
          type: string
          enum:
          - NUMBER
      required:
      - type
      - value
    RangeValue:
      type: object
      additionalProperties: false
      properties:
        lower:
          type: number
        upper:
          type: number
        type:
          type: string
          enum:
          - RANGE
      required:
      - lower
      - type
      - upper
    ScalarValue:
      discriminator:
        propertyName: type
        mapping:
          BOOLEAN: "#/components/schemas/BooleanValue"
          NUMBER: "#/components/schemas/NumberValue"
          CODE: "#/components/schemas/CodeValue"
          TEXT: "#/components/schemas/TextValue"
      oneOf:
      - $ref: "#/components/schemas/BooleanValue"
      - $ref: "#/components/schemas/NumberValue"
      - $ref: "#/components/schemas/CodeValue"
      - $ref: "#/components/schemas/TextValue"
    SetValue:
      type: object
      additionalProperties: false
      properties:
        valueType:
          type: string
          enum:
          - BOOLEAN
          - NUMBER
          - CODE
          - TEXT
        values:
          type: array
          items:
            $ref: "#/components/schemas/ScalarValue"
        type:
          type: string
          enum:
          - SET
      required:
      - type
      - valueType
      - values
    TextValue:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
        type:
          type: string
          enum:
          - TEXT
      required:
      - type
      - value
    RecordedResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - RECORDED
    PresenceResponse:
      type: object
      properties:
        presenceId:
          type: string
          format: uuid
        presenceToken:
          type: string
          description: "Opaque token returned only at creation. Authenticate subsequent\
            \ presence requests with `Authorization: KavoziPresence <presenceToken>`."
        expiresAt:
          type: string
          format: date-time
        locationUpdateAfterSeconds:
          type: integer
          format: int32
        inboxPollAfterSeconds:
          type: integer
          format: int32
    EncounterResponse:
      type: object
      properties:
        encounterId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - WAITING_FOR_MEMBERS
          - OPEN
          - CLOSED
          - EXPIRED
        membershipVersion:
          type: integer
          format: int64
        expectedInitialParticipants:
          type: integer
          format: int64
        activeParticipants:
          type: integer
          format: int64
        maxParticipants:
          type: integer
          format: int32
        admissionPolicy:
          type: string
          enum:
          - MEMBERS_MAY_INVITE
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantResponse"
        self:
          $ref: "#/components/schemas/SelfMembershipResponse"
        mySource:
          $ref: "#/components/schemas/LocalSourceResponse"
        lastSequence:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        admissionDeadline:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
    LocalSourceResponse:
      type: object
      properties:
        offerHandle:
          type: string
          format: uuid
        localDiscoveryProjectionIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
    ParticipantResponse:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - ACTIVE
          - LEFT
        joinedAt:
          type: string
          format: date-time
        leftAt:
          type: string
          format: date-time
    SelfMembershipResponse:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
        firstVisibleSequence:
          type: integer
          format: int64
    RegistrationRequest:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        challenge:
          type: string
          description: Unpadded Base64url 32-byte challenge
          maxLength: 43
          minLength: 43
        publicKey:
          type: string
          description: Same unpadded Base64url canonical Ed25519 DER SubjectPublicKeyInfo
          maxLength: 512
          minLength: 1
        signature:
          type: string
          description: Unpadded Base64url Ed25519 signature of the canonical registration
            statement
          maxLength: 86
          minLength: 86
      required:
      - challenge
      - challengeId
      - publicKey
      - signature
    NodeResponse:
      type: object
      properties:
        nodeId:
          type: string
          format: uuid
        fingerprint:
          type: string
          description: SHA-256 of canonical DER SubjectPublicKeyInfo
          pattern: "sha256:[A-Za-z0-9_-]{43}"
        keyAlgorithm:
          type: string
          enum:
          - Ed25519
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
        createdAt:
          type: string
          format: date-time
    ChallengeRequest:
      type: object
      properties:
        publicKey:
          type: string
          description: Unpadded Base64url canonical Ed25519 DER SubjectPublicKeyInfo
          maxLength: 512
          minLength: 1
      required:
      - publicKey
    ChallengeResponse:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        challenge:
          type: string
          description: Unpadded Base64url 32-byte single-use challenge
          maxLength: 43
          minLength: 43
        fingerprint:
          type: string
          description: SHA-256 of canonical DER SubjectPublicKeyInfo
          pattern: "sha256:[A-Za-z0-9_-]{43}"
        expiresAt:
          type: string
          format: date-time
    JoinEncounterRequest:
      type: object
      properties:
        invitationId:
          type: string
          format: uuid
        invitationToken:
          type: string
          minLength: 1
          pattern: "[A-Za-z0-9_-]{43}"
        membershipVersion:
          type: integer
          format: int64
          maximum: 9007199254740991
          minimum: 1
      required:
      - invitationId
      - invitationToken
      - membershipVersion
    SendEncounterMessageRequest:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
        membershipVersion:
