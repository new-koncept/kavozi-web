openapi: 3.1.0
info:
  title: Wing Pal Location
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /v1/presences/{presenceId}/location:
    put:
      tags:
      - location-controller
      operationId: updateLocation
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FixResponse"
      security:
      - presenceToken: []
  /v1/presences/{presenceId}/discovery-areas:
    put:
      tags:
      - location-controller
      operationId: replaceDiscoveryAreas
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreasRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedResponse"
      security:
      - presenceToken: []
  /v1/presences:
    post:
      tags:
      - location-controller
      summary: Create an anonymous presence; raw token returned once
      operationId: createPresence
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PresenceResponse"
  /v1/presences/{presenceId}/offers/{offerHandle}/decline:
    post:
      tags:
      - location-controller
      operationId: declineLocationOffer
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offerHandle
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedResponse"
      security:
      - presenceToken: []
  /v1/presences/{presenceId}/offers/{offerHandle}/accept:
    post:
      tags:
      - location-controller
      operationId: acceptLocationOffer
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offerHandle
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedResponse"
      security:
      - presenceToken: []
  /v1/presences/{presenceId}/inbox:
    get:
      tags:
      - location-controller
      operationId: getPresenceInbox
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InboxResponse"
      security:
      - presenceToken: []
  /v1/location/administrative-areas:
    get:
      tags:
      - location-controller
      operationId: searchAdministrativeAreas
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - CITY
          - DISTRICT
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdministrativeAreaResponse"
  /v1/intent-templates:
    get:
      tags:
      - intent-template-controller
      summary: List enabled intent templates
      operationId: listIntentTemplates
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntentTemplateSummary"
  /v1/intent-templates/{key}:
    get:
      tags:
      - intent-template-controller
      summary: Get an enabled intent template
      operationId: getIntentTemplate
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Unknown or disabled template
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Template definition
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateResponse"
  /.well-known/kavozi-location:
    get:
      tags:
      - location-controller
      operationId: getLocationMetadata
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataResponse"
  /v1/presences/{presenceId}:
    delete:
      tags:
      - location-controller
      operationId: deletePresence
      parameters:
      - name: presenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
      security:
      - presenceToken: []
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    FixRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        accuracyMeters:
          type: number
          format: double
          minimum: 0
        observedAt:
          type: string
          format: date-time
        sequence:
          type: integer
          format: int64
          minimum: 0
      required:
      - accuracyMeters
      - latitude
      - longitude
      - observedAt
      - sequence
    FixResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACCEPTED
        sequence:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time
    AreaRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - RADIUS
          - ADMINISTRATIVE_AREA
        radiusMeters:
          type: number
          format: double
        administrativeAreaId:
          type: string
          format: uuid
      required:
      - id
      - type
    AreasRequest:
      type: object
      properties:
        areas:
          type: array
          items:
            $ref: "#/components/schemas/AreaRequest"
      required:
      - areas
    RecordedResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - RECORDED
    PresenceResponse:
      type: object
      properties:
        presenceId:
          type: string
          format: uuid
        presenceToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        locationUpdateAfterSeconds:
          type: integer
          format: int32
        inboxPollAfterSeconds:
          type: integer
          format: int32
    InboxResponse:
      type: object
      properties:
        pollAfterSeconds:
          type: integer
          format: int32
        offers:
          type: array
          items:
            $ref: "#/components/schemas/OfferResponse"
    OfferResponse:
      type: object
      properties:
        offerHandle:
          type: string
          format: uuid
        localDiscoveryAreaIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
        expiresAt:
          type: string
          format: date-time
    AdministrativeAreaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - CITY
          - DISTRICT
    IntentTemplateSummary:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
    AgentConfiguration:
      type: object
      properties:
        enabled:
          type: boolean
        label:
          type: string
        prompt:
          type: string
        maxLength:
          type: integer
          format: int32
        required:
          type: boolean
    BooleanConstraints:
      type: object
      properties:
        kind:
          type: string
          enum:
          - BOOLEAN
      required:
      - kind
    CodeConstraints:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/FieldOption"
        kind:
          type: string
          enum:
          - CODE
      required:
      - kind
    FieldConstraints:
      discriminator:
        propertyName: kind
        mapping:
          NUMBER: "#/components/schemas/NumberConstraints"
          TEXT: "#/components/schemas/TextConstraints"
          CODE: "#/components/schemas/CodeConstraints"
          SET: "#/components/schemas/SetConstraints"
          RANGE: "#/components/schemas/RangeConstraints"
          BOOLEAN: "#/components/schemas/BooleanConstraints"
      oneOf:
      - $ref: "#/components/schemas/NumberConstraints"
      - $ref: "#/components/schemas/TextConstraints"
      - $ref: "#/components/schemas/CodeConstraints"
      - $ref: "#/components/schemas/SetConstraints"
      - $ref: "#/components/schemas/RangeConstraints"
      - $ref: "#/components/schemas/BooleanConstraints"
    FieldOption:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        order:
          type: integer
          format: int32
    NumberConstraints:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        step:
          type: number
        unit:
          type: string
        kind:
          type: string
          enum:
          - NUMBER
      required:
      - kind
    RangeConstraints:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        step:
          type: number
        unit:
          type: string
        kind:
          type: string
          enum:
          - RANGE
      required:
      - kind
    SetConstraints:
      type: object
      properties:
        minItems:
          type: integer
          format: int32
        maxItems:
          type: integer
          format: int32
        elementType:
          type: string
          enum:
          - BOOLEAN
          - NUMBER
          - CODE
          - TEXT
          - INSTANT
          - REFERENCE
        options:
          type: array
          items:
            $ref: "#/components/schemas/FieldOption"
        kind:
          type: string
          enum:
          - SET
      required:
      - kind
    TemplateField:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
          - BOOLEAN
          - NUMBER
          - CODE
          - TEXT
          - SET
          - RANGE
        roles:
          type: array
          items:
            type: string
            enum:
            - CLAIM
            - REQUIREMENT
            - PREFERENCE
            - ENCOUNTER_OPTION
          uniqueItems: true
        operators:
          type: array
          items:
            type: string
            enum:
            - EQ
            - NEQ
            - GT
            - GTE
            - LT
            - LTE
            - IN
            - NOT_IN
            - INTERSECTS
            - CONTAINS_ALL
            - RANGE_INTERSECTS
        required:
          type: boolean
        constraints:
          $ref: "#/components/schemas/FieldConstraints"
    TemplateResponse:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/TemplateField"
        agentConfiguration:
          $ref: "#/components/schemas/AgentConfiguration"
    TextConstraints:
      type: object
      properties:
        minLength:
          type: integer
          format: int32
        maxLength:
          type: integer
          format: int32
        kind:
          type: string
          enum:
          - TEXT
      required:
      - kind
    MetadataResponse:
      type: object
      properties:
        apiVersion:
          type: string
        presenceTtlSeconds:
          type: integer
          format: int64
        locationFreshnessSeconds:
          type: integer
          format: int64
        locationUpdateAfterSeconds:
          type: integer
          format: int32
        inboxPollAfterSeconds:
          type: integer
          format: int32
        discoveryIntervalMilliseconds:
          type: integer
          format: int64
        offerTtlSeconds:
          type: integer
          format: int64
        maxDiscoveryAreas:
          type: integer
          format: int32
        supportedAreaTypes:
          type: array
          items:
            type: string
            enum:
            - RADIUS
            - ADMINISTRATIVE_AREA
          uniqueItems: true
        minRadiusMeters:
          type: number
          format: double
        maxRadiusMeters:
          type: number
          format: double
        maxAccuracyMeters:
          type: number
          format: double
        futureToleranceSeconds:
          type: integer
          format: int64
  securitySchemes:
    presenceToken:
      type: apiKey
      description: KavozilPresence <token>; token returned once on presence creation
      name: Authorization
      in: header
